syntax = "proto3";

package net.discdd.app.trick;

option java_multiple_files = true;
option java_package = "net.discdd.app.trick";

// DDD envelope for Trick messaging: routes payload to destination client.
// The Trick app serializes this and sends it in AppDataUnit.data.
message TrickADU {
  string destination_client_id = 1;
  bytes chat_message = 2;  // serialized ChatMessage from message.proto
}
